<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Product lifecycle</title>
<desc id="desc">Six connected stages: Discover, Define, Prioritise, Deliver, Measure and Learn.</desc>
<defs>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#16A6A0"/><stop offset="1" stop-color="#6478D8"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17283A"/><stop offset="1" stop-color="#101A29"/></linearGradient>
</defs>
<rect width="1200" height="250" rx="18" fill="#0D1624"/>
<path d="M115 104H1085" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <g><rect x="25" y="53" width="170" height="104" rx="13" fill="url(#card)" stroke="#2D6470"/><circle cx="110" cy="104" r="19" fill="#176B70"/><text x="110" y="110" fill="#fff" font-size="16" font-weight="700">01</text><text x="110" y="137" fill="#E8F0F7" font-size="15" font-weight="700">DISCOVER</text></g>
 <g><rect x="222" y="53" width="170" height="104" rx="13" fill="url(#card)" stroke="#2D6470"/><circle cx="307" cy="104" r="19" fill="#176B70"/><text x="307" y="110" fill="#fff" font-size="16" font-weight="700">02</text><text x="307" y="137" fill="#E8F0F7" font-size="15" font-weight="700">DEFINE</text></g>
 <g><rect x="419" y="53" width="170" height="104" rx="13" fill="url(#card)" stroke="#385B83"/><circle cx="504" cy="104" r="19" fill="#315A8B"/><text x="504" y="110" fill="#fff" font-size="16" font-weight="700">03</text><text x="504" y="137" fill="#E8F0F7" font-size="15" font-weight="700">PRIORITISE</text></g>
 <g><rect x="616" y="53" width="170" height="104" rx="13" fill="url(#card)" stroke="#385B83"/><circle cx="701" cy="104" r="19" fill="#315A8B"/><text x="701" y="110" fill="#fff" font-size="16" font-weight="700">04</text><text x="701" y="137" fill="#E8F0F7" font-size="15" font-weight="700">DELIVER</text></g>
 <g><rect x="813" y="53" width="170" height="104" rx="13" fill="url(#card)" stroke="#514F8C"/><circle cx="898" cy="104" r="19" fill="#514F8C"/><text x="898" y="110" fill="#fff" font-size="16" font-weight="700">05</text><text x="898" y="137" fill="#E8F0F7" font-size="15" font-weight="700">MEASURE</text></g>
 <g><rect x="1010" y="53" width="165" height="104" rx="13" fill="url(#card)" stroke="#514F8C"/><circle cx="1092" cy="104" r="19" fill="#514F8C"/><text x="1092" y="110" fill="#fff" font-size="16" font-weight="700">06</text><text x="1092" y="137" fill="#E8F0F7" font-size="15" font-weight="700">LEARN</text></g>
</g>
<text x="600" y="207" fill="#91A5BA" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle">A continuous loop: insights shape priorities, delivery creates evidence, and evidence informs the next iteration.</text>
</svg>